<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ArtFlow Studio</title>
<style>
:root{--bg:#0d0f13;--panel:#15181f;--panel2:#1b1f28;--line:#272c38;--line2:#343a49;--text:#e8eaf0;--muted:#8d95a8;--acc:#f2b84b;--accText:#1a1305;--ok:#4ade80;--err:#f87171;--r:10px}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 system-ui,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
header{flex:0 0 58px;display:flex;align-items:center;gap:12px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header .brand{display:flex;align-items:center;gap:10px;font-weight:650;font-size:16px;letter-spacing:.2px;white-space:nowrap}
header .brand img{height:34px;width:34px;border-radius:8px;object-fit:cover}
header .brand small{display:block;font-weight:400;font-size:11.5px;color:var(--muted);letter-spacing:0}
#byline{flex:1;text-align:center;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
#byline b{color:var(--text);font-weight:600}
.conn{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12.5px;white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;background:var(--err)}
.dot.on{background:var(--ok)}
.btn{background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:8px 13px;cursor:pointer;white-space:nowrap;color:var(--text);text-decoration:none;display:inline-block}
.btn:hover{border-color:#4a5266}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn.go{background:var(--acc);border-color:var(--acc);color:var(--accText);font-weight:700;padding:9px 26px;font-size:15px}
.btn.go:hover{filter:brightness(1.07)}
.btn.stop{border-color:#6b2f2f;color:#ffb4b4}
.lang{display:flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.lang button{background:none;border:0;padding:6px 9px;cursor:pointer;font-size:12px;color:var(--muted)}
.lang button.act{background:var(--acc);color:var(--accText);font-weight:700}
.runs{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:12.5px;white-space:nowrap}
.runs input{width:58px}
main{flex:1;min-height:0;display:grid;grid-template-columns:400px minmax(0,1fr) 400px;grid-template-areas:"l c r"}
#colL{grid-area:l}#colC{grid-area:c}#colR{grid-area:r}
.col{overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:12px;min-height:0}
#colL{border-right:1px solid var(--line)}#colR{border-left:1px solid var(--line)}
@media (max-width:1320px){main{grid-template-columns:400px minmax(0,1fr);grid-template-rows:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"l c" "r c"}#colR{border-left:0;border-right:1px solid var(--line);border-top:1px solid var(--line)}#byline{display:none}}
details.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
details.card>summary{list-style:none;cursor:pointer;padding:11px 14px;font-weight:650;font-size:14.5px;display:flex;align-items:center;gap:8px;user-select:none}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::after{content:"▾";margin-left:auto;color:var(--muted);transition:transform .15s}
details.card:not([open])>summary::after{transform:rotate(-90deg)}
details.card>summary .n{color:var(--acc);font-weight:700}
.cbody{padding:2px 14px 14px;display:flex;flex-direction:column;gap:11px}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f.inline{flex-direction:row;align-items:center;justify-content:space-between;gap:10px}
.f[hidden],.gbody[hidden]{display:none}
.lab{font-size:12.5px;color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row{display:flex;gap:8px;align-items:center;min-width:0;flex-wrap:wrap}
input[type=text],input[type=number],select,textarea{background:var(--bg);border:1px solid var(--line2);border-radius:7px;padding:7px 9px;width:100%;min-width:0;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
textarea{resize:vertical;line-height:1.4}
textarea.mono{font:12px/1.45 ui-monospace,Consolas,monospace;white-space:pre;overflow:auto}
.num{display:flex;gap:8px;align-items:center}
.num input[type=number]{width:84px;flex:0 0 84px}
.num input[type=range]{flex:1;min-width:0;accent-color:var(--acc)}
.sw{position:relative;display:inline-block;width:38px;height:22px;flex:0 0 38px;cursor:pointer}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:#394052;border-radius:22px;transition:.15s}
.sw span::before{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#cfd4e0;transition:.15s}
.sw input:checked+span{background:var(--acc)}
.sw input:checked+span::before{transform:translateX(16px);background:#1a1305}
.chk{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap;cursor:pointer}
.chk input{accent-color:var(--acc)}
.sub{border:1px solid var(--line);border-radius:9px;padding:11px;display:flex;flex-direction:column;gap:10px;background:var(--panel2)}
.subhead{display:flex;align-items:center;gap:10px}
.muted{color:var(--muted);font-size:12.5px}
.loras{display:flex;flex-direction:column;gap:7px}
.lora{display:grid;grid-template-columns:38px minmax(0,1fr) 26px;grid-template-areas:"s f x" ". n n";gap:6px 8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:9px;background:var(--panel2)}
.lora>.sw{grid-area:s}.lora>select{grid-area:f}.lora>.num{grid-area:n}.lora>.x{grid-area:x}
.lora.off select,.lora.off .num{opacity:.45}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:14px;padding:2px}
.x:hover{color:var(--err)}
.gcard{border:1px solid var(--line);border-radius:9px;background:var(--panel2)}
.gcard.on{border-color:#6b5524}
.ghead{display:flex;align-items:center;gap:11px;padding:10px 11px}
.gt{display:flex;flex-direction:column;min-width:0}
.gt b{font-weight:600}
.gt span{font-size:12px;color:var(--muted)}
.gbody{padding:2px 11px 12px;display:flex;flex-direction:column;gap:10px}
.imgpick{display:flex;flex-direction:column;gap:7px}
.drop{position:relative;height:150px;border:1px dashed var(--line2);border-radius:9px;background:var(--bg);display:flex;align-items:center;justify-content:center;cursor:pointer;overflow:hidden}
.drop.over{border-color:var(--acc)}
.drop img{max-width:100%;max-height:100%;object-fit:contain}
.dropmsg{position:absolute;left:0;right:0;bottom:0;padding:4px;text-align:center;font-size:11.5px;color:#cfd4e0;background:rgba(0,0,0,.55)}
details.mini>summary{cursor:pointer;color:var(--muted);font-size:12.5px;user-select:none}
details.mini[open]>summary{margin-bottom:8px}
details.mini>div{display:flex;flex-direction:column;gap:10px}
.note{font-size:12.5px;background:#2a2412;border:1px solid #5c4a18;color:#f3dfa6;border-radius:8px;padding:8px 10px}
.note[hidden]{display:none}
#colC{display:flex;flex-direction:column;min-height:0;min-width:0}
#miss{flex:0 0 auto;margin:10px 14px 0;max-height:26vh;overflow:auto}
#miss ul{margin:6px 0 0;padding-left:18px}
#miss .row{justify-content:space-between}
#stage{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;background:#090a0d}
#stage img{max-width:100%;max-height:100%;object-fit:contain}
#empty{color:var(--muted);text-align:center;padding:30px;max-width:440px}
#badge{position:absolute;left:12px;top:12px;background:rgba(0,0,0,.6);border:1px solid var(--line2);border-radius:20px;padding:3px 10px;font-size:12px}
#badge[hidden]{display:none}
#prog{flex:0 0 auto;padding:8px 14px;border-top:1px solid var(--line);background:var(--panel);display:flex;align-items:center;gap:12px;font-size:12.5px}
#progText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;color:var(--muted)}
#bar{flex:0 0 220px;height:6px;background:var(--line);border-radius:6px;overflow:hidden}
#bar i{display:block;height:100%;width:0;background:var(--acc);transition:width .15s}
#steps{flex:0 0 auto;display:flex;gap:8px;padding:8px 14px;overflow-x:auto;background:var(--panel);border-top:1px solid var(--line);align-items:center;min-height:50px}
.chip{display:flex;align-items:center;gap:7px;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:4px 9px 4px 4px;cursor:pointer;white-space:nowrap;font-size:12.5px}
.chip img{width:34px;height:34px;object-fit:cover;border-radius:5px}
.chip.act{border-color:var(--acc)}
#steps .sp{flex:1}
#infoWrap{flex:0 0 auto;border-top:1px solid var(--line);background:var(--panel)}
#infoWrap>summary{cursor:pointer;padding:7px 14px;font-size:12px;color:var(--muted);user-select:none}
#info{max-height:24vh;overflow:auto;padding:2px 14px 10px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
#info h4{margin:0 0 4px;font-size:12px;color:var(--muted);font-weight:600;display:flex;gap:8px;align-items:center}
#info pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12px/1.5 ui-monospace,Consolas,monospace;color:#cdd2df}
#hist{flex:0 0 auto;display:flex;gap:6px;padding:8px 14px;overflow-x:auto;border-top:1px solid var(--line);background:var(--panel)}
#hist:empty{display:none}
#hist img{width:54px;height:54px;object-fit:cover;border-radius:6px;cursor:pointer;border:1px solid var(--line2);flex:0 0 auto}
#hist img:hover{border-color:var(--acc)}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:70;max-width:520px}
.toast{background:var(--panel2);border:1px solid var(--line2);border-left:4px solid var(--acc);border-radius:8px;padding:10px 12px;white-space:pre-wrap;box-shadow:0 8px 30px rgba(0,0,0,.5);font-size:13px}
.toast.err{border-left-color:var(--err)}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100vw);background:var(--panel);border-left:1px solid var(--line2);box-shadow:-20px 0 60px rgba(0,0,0,.55);transform:translateX(105%);transition:transform .2s;z-index:40;display:flex;flex-direction:column}
#drawer.open{transform:none}
#drawer .dh{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);font-weight:650}
#drawer .db{flex:1;overflow:auto;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
#drawer h3{margin:12px 0 2px;font-size:13px;color:var(--acc)}
details.node{border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
details.node>summary{cursor:pointer;padding:7px 10px;font-size:13px}
details.node>div{padding:4px 10px 10px;display:flex;flex-direction:column;gap:9px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.66);z-index:60;display:none;align-items:center;justify-content:center;padding:24px}
#modal.open{display:flex}
#modal .box{background:var(--panel);border:1px solid var(--line2);border-radius:12px;max-width:760px;width:100%;max-height:88vh;display:flex;flex-direction:column;box-shadow:0 30px 90px rgba(0,0,0,.6)}
#modal .mh{display:flex;align-items:center;gap:10px;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:650;font-size:16px}
#modal .mb{padding:6px 18px 18px;overflow:auto;font-size:13.5px;line-height:1.55}
#modal h3{margin:16px 0 6px;font-size:13px;color:var(--acc);text-transform:uppercase;letter-spacing:.5px}
#modal p{margin:0 0 8px}
#modal ul{margin:0 0 8px;padding-left:18px}
#modal li{margin:2px 0}
#modal a{color:var(--acc)}
#boot{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:80;color:var(--muted);text-align:center;padding:30px;white-space:pre-wrap}
</style>
</head>
<body>
<header>
  <div class="brand"><img id="logo" alt=""><div>ArtFlow Studio<small data-t="brandSub"></small></div></div>
  <div class="conn"><span class="dot" id="dot"></span><span id="connText"></span></div>
  <div id="byline">Workflow &amp; Studio created by <b>Lalikavics</b> · <span id="ver"></span></div>
  <div class="lang"><button type="button" data-lang="en">EN</button><button type="button" data-lang="hu">HU</button></div>
  <button class="btn sm" id="aboutBtn" type="button" data-t="about"></button>
  <button class="btn sm" id="advBtn" type="button" data-t="adv"></button>
  <label class="runs"><span data-t="runs"></span> <input type="number" id="runs" min="1" max="50" step="1" value="1"></label>
  <button class="btn stop" id="stopBtn" type="button" disabled data-t="stop"></button>
  <button class="btn go" id="goBtn" type="button" title="Ctrl+Enter"></button>
</header>
<main>
  <section class="col" id="colL"></section>
  <section id="colC">
    <div class="note" id="miss" hidden></div>
    <div id="stage"><div id="empty" data-t="empty"></div><img id="view" alt="" hidden><div id="badge" hidden></div></div>
    <div id="prog"><span id="progText"></span><div id="bar"><i></i></div><span id="seedInfo" class="muted"></span></div>
    <div id="steps"></div>
    <details id="infoWrap" open><summary data-t="infoSummary"></summary><div id="info">
      <div><h4 data-t="applied"></h4><pre id="applied">–</pre></div>
      <div><h4><span data-t="final"></span> <button class="btn sm" id="copyBtn" type="button" data-t="copy"></button></h4><pre id="final">–</pre><div id="moreTexts"></div></div>
    </div></details>
    <div id="hist"></div>
  </section>
  <section class="col" id="colR"></section>
</main>
<aside id="drawer"><div class="dh"><span data-t="advTitle"></span><span style="flex:1"></span><button class="btn sm" id="advClose" type="button" data-t="close"></button></div><div class="db" id="advBody"></div></aside>
<div id="modal"><div class="box"><div class="mh"><span id="modalTitle"></span><span style="flex:1"></span><button class="btn sm" id="modalClose" type="button" data-t="close"></button></div><div class="mb" id="modalBody"></div></div></div>
<div id="toasts"></div>
<div id="boot">Loading…</div>

function promptError(j) {
  let msg = (j.error && (j.error.message || j.error)) || t('rejected');
  for (const [id, e] of Object.entries(j.node_errors || {})) msg += '\n• ' + titleOf(id) + ': ' + (e.errors || []).map(x => x.message + (x.details ? ' (' + x.details + ')' : '')).join('; ');
  toast(String(msg), 'err');
}
async function stop() {
  const pend = [...R.jobs.keys()].filter(id => id !== R.job);
  try { if (pend.length) await fetch(API + '/queue', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({delete: pend})}); pend.forEach(id => R.jobs.delete(id)); await fetch(API + '/interrupt', {method: 'POST'}); } catch (_) {}
  busy();
}
function busy() { const n = R.jobs.size; $('#stopBtn').disabled = n === 0; $('#goBtn').textContent = n ? t('goQ', n) : t('go'); }

/* ---------- results ---------- */
function setProg(key, args, frac, raw) { R.prog = [key, args || [], raw || '']; $('#progText').textContent = raw != null && raw !== '' ? raw : t(key, ...(args || [])); $('#bar i').style.width = (frac == null ? 0 : Math.max(0, Math.min(1, frac)) * 100) + '%'; }
function show(url, badgeKey, live) { const v = $('#view'); v.src = url; v.hidden = false; $('#empty').hidden = true; if (!live) R.cur = url; R.curBadge = badgeKey || ''; const b = $('#badge'); b.hidden = !badgeKey; b.textContent = badgeKey ? t(badgeKey) : ''; }
function curStep() { if (R.sel && R.steps[R.sel]) return R.sel; for (let i = STEP_ORDER.length - 1; i >= 0; i--) if (R.steps[STEP_ORDER[i]]) return STEP_ORDER[i]; return null; }
function renderSteps() {
  const box = $('#steps'); box.replaceChildren(); const cur = curStep();
  for (const id of [...STEP_ORDER, '75', '56']) { if (!R.steps[id]) continue; box.append(h('div', {class: 'chip' + (id === cur ? ' act' : ''), onclick: () => { R.sel = id; refresh(); }}, h('img', {src: R.steps[id][0], alt: ''}), t('s' + id))); }
  if (R.cur) box.append(h('span', {class: 'sp'}),
    h('button', {class: 'btn sm', type: 'button', text: t('open'), onclick: () => window.open(R.cur, '_blank')}),
    h('a', {class: 'btn sm', href: R.cur, download: 'artflow_' + (R.seed || '') + '.png', text: t('download')}),
    T.groups['1e'] ? h('button', {class: 'btn sm', type: 'button', text: t('useStart'), title: t('useStartT'), onclick: useAsStart}) : null);
}
function refresh() { const id = curStep(); if (id) show(R.steps[id][0], 's' + id); renderSteps(); }
function summaryText() {
  const raw = T.ids && T.ids.info ? R.texts[T.ids.info] : null; if (!raw) return R.texts['90'] || '–';
  const d = {}; raw.split('|').forEach(p => { const i = p.indexOf('='); if (i > 0) d[p.slice(0, i)] = p.slice(i + 1); });
  const steps = (d.steps || '').split(/[ ,]+/).filter(Boolean).map(k => STEP_NAME[k] ? k + ' ' + t(STEP_NAME[k]) : k);
  return [
    t('sumSrc') + ': ' + (d.src === 'own' ? t('srcOwn') : t('srcImage')),
    t('theme') + ': ' + disp(d.theme || ''),
    t('sumSize') + ': ' + (d.i2i === '1' ? t('sizeStart') : d.w + '×' + d.h) + '  ·  Shift: ' + d.shift,
    t('sumLora') + ': ' + d.lora + ' (' + t('lora_' + d.lora_src) + ')',
    t('sumStart') + ': ' + (d.i2i === '1' ? t('startOn', d.denoise) : t('startOff')),
    t('sumDen', d.refine, d.upscale),
    t('sumLook') + ': ' + t('look_' + d.look),
    t('sumSteps') + ': ' + (steps.length ? steps.join(', ') : t('any'))
  ].join('\n');
}
function renderTexts() {
  $('#applied').textContent = summaryText(); $('#final').textContent = R.texts['91'] || '–';
  const m = $('#moreTexts'); m.replaceChildren();
  for (const id of ['42', '49', '50', '80']) if (R.texts[id]) m.append(h('h4', {text: t('t' + id), style: 'margin-top:8px'}), h('pre', {text: R.texts[id]}));
}
function takeOutput(node, out) {
  if (!out) return; node = String(node);
  if (Array.isArray(out.images) && out.images.length) { R.steps[node] = out.images.map(im => API + '/view?filename=' + encodeURIComponent(im.filename) + '&subfolder=' + encodeURIComponent(im.subfolder || '') + '&type=' + encodeURIComponent(im.type || 'output')); refresh(); }
  if (out.text != null) { R.texts[node] = Array.isArray(out.text) ? out.text.flat().join('\n') : String(out.text); renderTexts(); }
}
function addHistory(url) { if (!url) return; H = [{url, seed: R.seed, t: Date.now()}, ...H.filter(x => x.url !== url)].slice(0, 40); try { localStorage.setItem(LS_HIST, JSON.stringify(H)); } catch (_) {} renderHistory(); }
function renderHistory() { const b = $('#hist'); b.replaceChildren(...H.map(x => { const i = h('img', {src: x.url, alt: '', title: t('seed', x.seed == null ? '?' : x.seed), loading: 'lazy'}); i.onclick = () => { show(x.url, 'earlier'); renderSteps(); }; i.onerror = () => { H = H.filter(y => y !== x); i.remove(); }; return i; })); }
async function useAsStart() {
  if (!R.cur) return;
  try { const b = await (await fetch(R.cur)).blob(); const nm = await uploadImage(new File([b], 'artflow_start_' + Date.now() + '.png', {type: b.type || 'image/png'})); setVal('95', 'image', nm); S.groups['1e'] = true; save(); renderControls(); toast(t('useStartOk')); }
  catch (e) { toast(t('useStartErr', e.message), 'err'); }
}
async function finish(id, ok) {
  const mine = R.jobs.has(id); R.jobs.delete(id); busy(); if (!mine) return;
  if (ok) {
    try { const j = await (await fetch(API + '/history/' + id)).json(); const outs = (j[id] && j[id].outputs) || {}; for (const [node, out] of Object.entries(outs)) if (!R.steps[node] || out.text != null) takeOutput(node, out); } catch (_) {}
    R.sel = null; refresh(); const st = curStep(); if (st) addHistory(R.steps[st][0]);
    const secs = ((Date.now() - R.t0) / 1000).toFixed(1); setProg('done', [secs], R.jobs.size ? 0 : 1, t('done', secs) + (R.jobs.size ? t('moreQ', R.jobs.size) : ''));
  }
  if (R.job === id) R.job = null;
}
function onMsg(ev) {
  if (typeof ev.data !== 'string') {
    try { const dv = new DataView(ev.data); const type = dv.getUint32(0); let off = 8, mime = dv.getUint32(4) === 2 ? 'image/png' : 'image/jpeg';
      if (type === 4) { off = 8 + dv.getUint32(4); mime = 'image/jpeg'; } else if (type !== 1) return;
      if (R.job) show(URL.createObjectURL(new Blob([ev.data.slice(off)], {type: mime})), 'live', true); } catch (_) {}
    return;
  }
  let m; try { m = JSON.parse(ev.data); } catch (_) { return; } const d = m.data || {};
  if (m.type === 'status') { const q = d.status && d.status.exec_info ? d.status.exec_info.queue_remaining : null; R.queue = q; conn(true); return; }
  if (d.prompt_id && !R.jobs.has(d.prompt_id)) return;
  if (m.type === 'execution_start') { R.job = d.prompt_id; R.steps = {}; R.texts = {}; R.sel = null; R.t0 = Date.now(); R.seed = R.jobs.get(d.prompt_id).seed; $('#seedInfo').textContent = t('seed', R.seed); renderSteps(); renderTexts(); setProg('starting', [], 0); }
  else if (m.type === 'executing') { if (d.node) setProg('', [], 0, titleOf(String(d.node)) + '…'); }
  else if (m.type === 'progress') { setProg('', [], d.max ? d.value / d.max : 0, titleOf(String(d.node || '')) + ' – ' + d.value + ' / ' + d.max); }
  else if (m.type === 'executed') takeOutput(d.node, d.output);
  else if (m.type === 'execution_success') finish(d.prompt_id, true);
  else if (m.type === 'execution_error') { toast(t('runErr', titleOf(String(d.node_id)), (d.exception_message || '').trim()), 'err'); setProg('stopped', [], 0); finish(d.prompt_id, false); }
  else if (m.type === 'execution_interrupted') { setProg('cancelled', [], 0); finish(d.prompt_id, false); }
}
let CONN = null;
function conn(on) { if (on != null) CONN = on; $('#dot').classList.toggle('on', !!CONN); $('#connText').textContent = CONN == null ? t('connecting') : CONN ? t('connected') + (R.queue ? ' · ' + t('queue', R.queue) : '') : t('offline'); }
function connect() {
  const ws = new WebSocket((API_URL.protocol === 'https:' ? 'wss://' : 'ws://') + API_URL.host + '/ws?clientId=' + CLIENT); ws.binaryType = 'arraybuffer';
  ws.onopen = () => conn(true); ws.onclose = () => { conn(false); setTimeout(connect, 2000); }; ws.onmessage = onMsg;
}

/* ---------- language + start ---------- */
function applyLang() {
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = t(e.getAttribute('data-t')); });
  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('act', b.getAttribute('data-lang') === LANG));
  conn(); busy(); if (R.prog && R.prog[0]) setProg(R.prog[0], R.prog[1], parseFloat($('#bar i').style.width) / 100 || 0, R.prog[0] === 'done' ? t('done', R.prog[1][0]) : null);
  if (R.seed != null) $('#seedInfo').textContent = t('seed', R.seed);
  const b = $('#badge'); if (R.curBadge) b.textContent = t(R.curBadge);
  if (T) { renderControls(); renderSteps(); renderTexts(); renderHistory(); if ($('#drawer').classList.contains('open')) renderAdvanced(); if ($('#modal').classList.contains('open')) openAbout(); }
}
function setLang(l) { LANG = l; try { localStorage.setItem(LS_LANG, l); } catch (_) {} applyLang(); }
function openAbout() { $('#modalTitle').textContent = 'ArtFlow Studio – ' + t('about'); $('#modalBody').innerHTML = ABOUT[LANG] || ABOUT.en; $('#modal').classList.add('open'); }
async function boot() {
  $('#ver').textContent = 'v' + VERSION; applyLang();
  try {
    T = await loadTemplate(); NODEGROUP = {}; for (const [k, g] of Object.entries(T.groups)) for (const id of g.nodes) NODEGROUP[String(id)] = k;
    await loadOI(); loadState();
  } catch (e) { $('#boot').textContent = t('bootErr', e.message, API); return; }
  const logoUrl = API + '/view?filename=artflow-logo.png&subfolder=&type=input';
  const fav = document.createElement('link'); fav.rel = 'icon'; fav.href = logoUrl; document.head.append(fav);
  const logo = $('#logo'); logo.onerror = () => { logo.remove(); fav.href = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="#111"/><path d="M32 12 54 50H10z" fill="#f2b84b"/></svg>'); };
  logo.src = logoUrl;
  const runs = $('#runs'); runs.value = S.runs; runs.oninput = () => { S.runs = Math.max(1, Math.min(50, runs.valueAsNumber | 0 || 1)); save(); };
  $('#goBtn').onclick = run; $('#stopBtn').onclick = stop;
  $('#advBtn').onclick = () => { renderAdvanced(); $('#drawer').classList.add('open'); };
  $('#advClose').onclick = () => { $('#drawer').classList.remove('open'); renderControls(); };
  $('#aboutBtn').onclick = openAbout; $('#modalClose').onclick = () => $('#modal').classList.remove('open');
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') $('#modal').classList.remove('open'); });
  document.querySelectorAll('.lang button').forEach(b => { b.onclick = () => setLang(b.getAttribute('data-lang')); });
  $('#copyBtn').onclick = () => { const txt = $('#final').textContent; if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast(t('copied')), () => {}); };
  document.addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') { e.preventDefault(); run(); } if (e.key === 'Escape') $('#modal').classList.remove('open'); });
  setProg('ready', [], 0); applyLang(); connect(); $('#boot').remove();
}
boot();
</script>
